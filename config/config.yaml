# General --------------------------------------------------------------------
run_name        : "experiment_with_10_classes"     # used as experiment id
seed            : 42
n_classes       : 10                            # ! propagated via env var N_CLASSES
cutoff_year     : 1996
# Paths (all are resolved relative to repo root) -----------------------------
data_exploration_dir: "${run_name}/data_exploration"                       # raw + processed sub‑dirs live here
artifacts_dir   : "${run_name}/artifacts" 
embeddings_dir  : "${run_name}/embeddings"
models_dir      : "${run_name}/models"
results_dir     : "${run_name}/results"

# Embedding & model choices ---------------------------------------------------
embedding_backend : "sbert"                    # [sbert | openai]
sbert_model_name  : "sentence-transformers/all-MiniLM-L12-v2"
openai_model_name : "text-embedding-3-small"

classifier        : "linear_svm"               # [linear_svm | naive_bayes | transformer_logreg]
rag_top_k         : 5                          # for RAG voting / centroids
use_llm_refine    : false                      # optional GPT‑3.5 refinement pass

# Training hyper‑parameters ---------------------------------------------------
batch_size      : 32
max_epochs      : 10
learning_rate   : 1e-3
weight_decay    : 1e-4
early_stopping  : 3

# Evaluation ------------------------------------------------------------------
test_split      : 0.20
metrics         : ["accuracy", "macro_f1", "auc_ovr"]

# Model Selection Configuration
# This file defines which models to train in the experiment

models:
  # Text Classification Models
  naive_bayes:
    enabled: true
    name: "Naive Bayes"
    class: "NaiveBayesClassifier"

  linear_svm:
    enabled: true
    name: "Linear SVM"
    class: "LinearSVMClassifier"
    params:
      # Calibration: enabled by default for reliable probability estimates
      # Uncalibrated SVM scores are NOT true probabilities - use calibration for production
      calibrate: true  # Default: true - enables CalibratedClassifierCV
      calibration_method: "sigmoid"  # Options: "sigmoid" (default) or "isotonic"

  linear_svm_bigrams:
    enabled: true
    name: "TF-IDF bigrams + SVM"
    class: "LinearSVMBigrams"
    params:
      # Calibration: enabled by default for reliable probability estimates
      # Uncalibrated SVM scores are NOT true probabilities - use calibration for production
      calibrate: true  # Default: true - enables CalibratedClassifierCV
      calibration_method: "sigmoid"  # Options: "sigmoid" (default) or "isotonic"

  transformer_logreg:
    enabled: true
    name: "MiniLM + LogReg"
    class: "TransformerLogReg"
    params:
      n_jobs: 2  # Capped for full dataset stability (default was -1, which oversubscribes RAM/cores)
      cv: 3  # Reduced from 5 for full dataset stability

  embedding_logreg:
    enabled: true
    name: "Embedding + LogReg (SBERT)"
    class: "EmbeddingLogReg"
    params:
      # Embedding backend configuration:
      # - use_openai: false (default) - Uses local SBERT embeddings (no API key needed)
      # - use_openai: true - Uses OpenAI embeddings (requires OPENAI_API_KEY)
      use_openai: false  # Default: false (uses SBERT). Set to true for OpenAI embeddings
      model: "${model.sbert_model_name}"  # SBERT model when use_openai: false
      # model: "${model.openai_model_name}"  # OpenAI model when use_openai: true (uncomment if needed)

  embedding_logreg_qwen:
    enabled: true
    name: "Embedding + LogReg (Qwen/Ollama)"
    class: "EmbeddingLogReg"
    params:
      # Use Ollama/Qwen embeddings via litellm + Ollama
      backend: "ollama"
      model: "${model.ollama_embedding_model_name}"

  # RAG-based models
  rag_kmajority:
    enabled: true
    name: "RAG-kMajority (SBERT)"
    class: "RagSklearnAdapter"
    params:
      method: "kmajority"
      top_k: "${model.rag_top_k}"
      use_openai: false

  rag_kmajority_qwen:
    enabled: true
    name: "RAG-kMajority (Qwen/Ollama)"
    class: "RagSklearnAdapter"
    params:
      method: "kmajority"
      top_k: "${model.rag_top_k}"
      # Retriever will pick up the Ollama/Qwen index; classifier will still use
      # the same FAISS-backed store, so no additional flags are needed here.

  rag_centroid:
    enabled: true
    name: "RAG-CentroidNN"
    class: "RagSklearnAdapter"
    params:
      method: "centroid"
      top_k: "${model.rag_top_k}"

  rag_llm_local:
    enabled: true  # TF-IDF retrieval + LLM (default prompt)
    name: "RAG-LLM (TF-IDF, default prompt)"
    class: "RagSklearnAdapter"
    params:
      method: "llm"
      top_k: "${model.rag_top_k}"
      # LLM model configuration:
      # - Default: Uses Ollama (ollama/llama3.1:8b) from main config - no API keys needed
      # - To use OpenAI LLM: Change model to "gpt-4o-mini" or "gpt-4o" (requires OPENAI_API_KEY)
      # - To use other providers: See litellm docs for supported models
      model: "${model.llm_model}"  # Default: ollama/llama3.1:8b (from main config)
      # Embedding configuration: Uses local SBERT embeddings (no API key needed)
      use_openai: false  # Always false for local embeddings
      embedder_model: "${model.sbert_model_name}"  # SBERT model for local embeddings
      # Prompt style configuration:
      # - "default": Full detailed prompt with all instructions
      # - "short": Concise prompt for faster/cheaper inference
      # - "n8n_prompt": Email cleaning + classification prompt (Catalan)
      prompt_style: "default"  # Options: "default", "short", "n8n_prompt"

  rag_llm_local_short:
    enabled: true  # TF-IDF retrieval + LLM (short prompt)
    name: "RAG-LLM (TF-IDF, short prompt)"
    class: "RagSklearnAdapter"
    params:
      method: "llm"
      top_k: "${model.rag_top_k}"
      # LLM model configuration:
      # - Default: Uses Ollama (ollama/llama3.1:8b) from main config - no API keys needed
      # - To use OpenAI LLM: Change model to "gpt-4o-mini" or "gpt-4o" (requires OPENAI_API_KEY)
      # - To use other providers: See litellm docs for supported models
      model: "${model.llm_model}"  # Default: ollama/llama3.1:8b (from main config)
      # Embedding configuration: Uses local SBERT embeddings (no API key needed)
      use_openai: false  # Always false for local embeddings
      embedder_model: "${model.sbert_model_name}"  # SBERT model for local embeddings
      # Prompt style configuration:
      # - "default": Full detailed prompt with all instructions
      # - "short": Concise prompt for faster/cheaper inference
      # - "n8n_prompt": Email cleaning + classification prompt (Catalan)
      prompt_style: "short"  # Options: "default", "short", "n8n_prompt"

  rag_llm_local_n8n:
    enabled: true  # TF-IDF retrieval + LLM (n8n prompt)
    name: "RAG-LLM (TF-IDF, n8n prompt)"
    class: "RagSklearnAdapter"
    params:
      method: "llm"
      top_k: "${model.rag_top_k}"
      # LLM model configuration:
      # - Default: Uses Ollama (ollama/llama3.1:8b) from main config - no API keys needed
      # - To use OpenAI LLM: Change model to "gpt-4o-mini" or "gpt-4o" (requires OPENAI_API_KEY)
      # - To use other providers: See litellm docs for supported models
      model: "${model.llm_model}"  # Default: ollama/llama3.1:8b (from main config)
      # Embedding configuration: Uses local SBERT embeddings (no API key needed)
      use_openai: false  # Always false for local embeddings
      embedder_model: "${model.sbert_model_name}"  # SBERT model for local embeddings
      # Prompt style configuration:
      # - "default": Full detailed prompt with all instructions
      # - "short": Concise prompt for faster/cheaper inference
      # - "n8n_prompt": Email cleaning + classification prompt (Catalan)
      prompt_style: "n8n_prompt"  # Options: "default", "short", "n8n_prompt"

  rag_llm_openai:
    enabled: false  # Disabled - too slow for full dataset. Enable for quick testing only.
    name: "RAG-LLM (OpenAI-embeddings)"
    class: "RagSklearnAdapter"
    params:
      method: "llm"
      top_k: "${model.rag_top_k}"
      # LLM model configuration:
      # - Uses OpenAI LLM (gpt-4o-mini) - requires OPENAI_API_KEY
      # - To use other providers: See litellm docs for supported models
      model: "gpt-4o-mini"  # Using OpenAI LLM (requires OPENAI_API_KEY)
      # Embedding configuration: Uses OpenAI embeddings (requires OPENAI_API_KEY)
      use_openai: true  # Always true for OpenAI embeddings

  rag_llm_sbert_embeddings:
    enabled: true
    name: "RAG-LLM (SBERT embeddings, default prompt)"
    class: "RagSklearnAdapter"
    params:
      method: "llm"
      top_k: "${model.rag_top_k}"
      model: "${model.llm_model}"
      backend: "sbert"
      prompt_style: "default"

  rag_llm_ollama_embeddings:
    enabled: true
    name: "RAG-LLM (Qwen embeddings, default prompt)"
    class: "RagSklearnAdapter"
    params:
      method: "llm"
      top_k: "${model.rag_top_k}"
      model: "${model.llm_model}"
      backend: "ollama"
      prompt_style: "default"

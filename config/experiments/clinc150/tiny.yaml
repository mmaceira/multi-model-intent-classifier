# Experiment config: CLINC150 tiny subset (quick smoke tests).
#
# Mirrors the legacy `config/dataset/clinc150/tiny.yaml` while relying on:
#   - config/base/defaults.yaml
#   - config/base/providers.yaml
#   - config/datasets/clinc150.yaml

general:
  run_name: "experiment_tiny_dataset"

dataset:
  max_classes: 10
  max_train_samples: 100
  max_test_samples: 50

model:
  embedding_backend: "sbert"
  sbert_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  openai_model_name: "text-embedding-3-small"
  ollama_embedding_model_name: "ollama/qwen3-embedding:latest"

  # Enable RAG‑LLM experiments using the Ollama provider (qwen2.5:14b by default).
  # This activates:
  # - RAG-LLM (TF-IDF, default/short/n8n prompts)
  # - RAG-LLM (SBERT embeddings, default prompt)
  # - RAG-LLM (Qwen embeddings, default prompt)
  llm_backend: "ollama"

  classifier: "linear_svm"
  rag_top_k: 5

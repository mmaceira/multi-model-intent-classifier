# Experiment config: CSV-based tiny multi-label subset.
#
# Thin override layered on top of:
#   - config/base/defaults.yaml
#   - config/base/providers.yaml
#   - config/datasets/multilabel_csv.yaml
#
general:
  run_name: "tiny"

dataset:
  # Tiny CSV-based multilabel experiment for quick tests
  multilabel: true
  min_samples_per_label: 10
  max_train_samples: 200
  max_val_samples: 50
  max_test_samples: 50

model:
  # Use a smaller neighborhood for RAG-style models in tiny runs
  rag_top_k: 5

# Experiment config: CSV-based tiny multi-label subset.
#
# Relies on:
#   - config/base/defaults.yaml
#   - config/base/providers.yaml
#   - config/datasets/multilabel_csv.yaml
#
general:
  run_name: "tiny"
  seed: 42

dataset:
  # Tiny CSV-based multilabel experiment for quick tests
  multilabel: true
  min_samples_per_label: 10
  max_train_samples: 200
  max_val_samples: 50
  max_test_samples: 50

model:
  embedding_backend: "sbert"
  sbert_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  openai_model_name: "text-embedding-3-small"

  classifier: "linear_svm"
  rag_top_k: 5

  llm_model: "ollama/llama3.1:8b"

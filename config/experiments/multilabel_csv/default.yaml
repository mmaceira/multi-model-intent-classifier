# Experiment config: CSV-based full multi-label dataset (default).
#
# Relies on:
#   - config/base/defaults.yaml
#   - config/base/providers.yaml
#   - config/datasets/multilabel_csv.yaml
#
general:
  run_name: "experiment_multilabel_csv"

dataset:
  # See `config/datasets/multilabel_csv.yaml` for base settings.
  # Here we only keep experiment-specific tweaks when needed.
  # min_samples_per_label is intentionally omitted (see legacy comments).
  # Full CSV-based multilabel experiment.
  multilabel: true

model:
  embedding_backend: "sbert"
  sbert_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  openai_model_name: "text-embedding-3-small"

  classifier: "linear_svm"
  rag_top_k: 25

  # Explicit LLM model; resolved defaults can be used if this is absent.
  llm_model: "ollama/llama3.1:8b"

general:
  # Seed for all experiments unless overridden in an experiment config
  seed: 42

dataset:
  # Default flags; per-dataset configs can override these.
  use_oos: false

analysis:
  threshold_sweep: false
  label_cooccurrence: true
  hardest_examples: true
  store_text: false

model:
  # Embedding options
  embedding_backend: "sbert"  # ["sbert", "openai", "ollama"]
  sbert_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  # RAG defaults
  rag_top_k: 25

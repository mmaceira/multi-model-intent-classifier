# Model Selection Configuration
# This file defines which models to train in the experiment

models:
  # Text Classification Models
  naive_bayes:
    enabled: true
    name: "Naive Bayes"
    class: "NaiveBayesClassifier"

  linear_svm:
    enabled: true
    name: "Linear SVM"
    class: "LinearSVMClassifier"
    params:
      # Calibration: enabled by default for reliable probability estimates
      # Uncalibrated SVM scores are NOT true probabilities - use calibration for production
      calibrate: true  # Default: true - enables CalibratedClassifierCV
      calibration_method: "sigmoid"  # Options: "sigmoid" (default) or "isotonic"

  linear_svm_bigrams:
    enabled: true
    name: "TF-IDF bigrams + SVM"
    class: "LinearSVMBigrams"
    params:
      # Calibration: enabled by default for reliable probability estimates
      # Uncalibrated SVM scores are NOT true probabilities - use calibration for production
      calibrate: true  # Default: true - enables CalibratedClassifierCV
      calibration_method: "sigmoid"  # Options: "sigmoid" (default) or "isotonic"

  transformer_logreg:
    enabled: true
    name: "MiniLM + LogReg"
    class: "TransformerLogReg"
    params:
      n_jobs: 2  # Capped for full dataset stability (default was -1, which oversubscribes RAM/cores)
      cv: 3  # Reduced from 5 for full dataset stability

  embedding_logreg:
    enabled: false  # Disabled by default. Can use SBERT (local, no API key) or OpenAI (requires OPENAI_API_KEY)
    name: "Embedding + LogReg"
    class: "EmbeddingLogReg"
    params:
      # Embedding backend configuration:
      # - use_openai: false (default) - Uses local SBERT embeddings (no API key needed)
      # - use_openai: true - Uses OpenAI embeddings (requires OPENAI_API_KEY)
      use_openai: false  # Default: false (uses SBERT). Set to true for OpenAI embeddings
      model: "${model.sbert_model_name}"  # SBERT model when use_openai: false
      # model: "${model.openai_model_name}"  # OpenAI model when use_openai: true (uncomment if needed)

  # RAG-based models
  rag_kmajority:
    enabled: true
    name: "RAG-kMajority"
    class: "RagSklearnAdapter"
    params:
      method: "kmajority"
      top_k: "${model.rag_top_k}"
      use_openai: false

  rag_centroid:
    enabled: true
    name: "RAG-CentroidNN"
    class: "RagSklearnAdapter"
    params:
      method: "centroid"
      top_k: "${model.rag_top_k}"

  rag_llm:
    enabled: false  # Disabled by default for full dataset runs (uses too much RAM/VRAM). Enable for small configs.
    name: "RAG-LLM"
    class: "RagSklearnAdapter"
    params:
      method: "llm"
      top_k: "${model.rag_top_k}"
      # LLM model configuration:
      # - Default: Uses Ollama (ollama/llama3.1:8b) from config.yaml - no API keys needed
      # - To use OpenAI LLM: Change model to "gpt-4o-mini" or "gpt-4o" (requires OPENAI_API_KEY)
      # - To use other providers: See litellm docs for supported models
      model: "${model.llm_model}"  # Default: ollama/llama3.1:8b (from config.yaml)
      # Embedding configuration:
      # - use_openai: false (default) - Uses local SBERT embeddings (no API key needed)
      # - use_openai: true - Uses OpenAI embeddings (requires OPENAI_API_KEY)
      use_openai: false  # Default: false (uses SBERT). Set to true for OpenAI embeddings
      embedder_model: "${model.sbert_model_name}"  # Used when use_openai: false

# Dataset loader configuration for CLINC150
# This config defines how to load the dataset from its source

source:
  type: "huggingface"  # Options: huggingface, github_json, csv, local_json
  identifier: "clinc_oos"
  config: "plus"  # HuggingFace dataset config name

# Field mappings - how to extract text and labels from the data
fields:
  text: "text"  # Field name containing the text/utterance
  label: "intent"  # Field name containing the label(s)

# Dataset characteristics
multilabel: false  # Single-label dataset
has_oos: true  # Dataset has out-of-scope examples
oos_label: "oos"  # Label value that indicates out-of-scope

# Split configuration
splits:
  type: "predefined"  # Dataset has predefined train/val/test splits
  train_split: "train"
  val_split: "validation"
  test_split: "test"

# Optional filters and processing
filters:
  min_samples_per_label: null  # Minimum samples per label (null = no filter)

# Label processing
label_processing:
  # For HuggingFace datasets, intent might be numeric - convert to string
  convert_numeric_to_string: true
  # Field in features that contains label names mapping (if applicable)
  label_names_feature: "intent"

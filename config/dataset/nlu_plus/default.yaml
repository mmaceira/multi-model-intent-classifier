# General Configuration
general:
  run_name: "experiment_nlu_plus"     # used as experiment id
  seed: 42

# Dataset configuration
dataset:
  name: "nlu_plus"                               # dataset name (must match directory name in config/dataset/)
  use_oos: false                                 # include out-of-scope examples (if supported by dataset)
  multilabel: true                                # Enable multi-label mode
  # No max_classes, max_train_samples, or max_test_samples - using full dataset

# Paths (all are resolved relative to repo root)
paths:
  data_exploration_dir: "output/${general.run_name}/data_exploration"  # raw + processed sub-dirs live here
  embeddings_dir: "output/${general.run_name}/embeddings"
  models_dir: "output/${general.run_name}/models"
  predictions_dir: "output/${general.run_name}/predictions"
  results_dir: "output/${general.run_name}/results"

# Model configuration
model:
  # Embedding options
  embedding_backend: "sbert"                     # [sbert | openai]
  sbert_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  openai_model_name: "text-embedding-3-small"

  # Classifier options
  classifier: "linear_svm"                       # [linear_svm | naive_bayes | transformer_logreg]
  rag_top_k: 25                                  # for RAG voting / centroids

  # LLM options are configured in config/llm_config.yaml
  # See that file for Ollama endpoint, model, and OpenAI settings

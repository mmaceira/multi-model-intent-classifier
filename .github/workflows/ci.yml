name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (dev)
        run: uv sync --extra dev --extra api

      - name: Lint with ruff
        run: uv run ruff check intent_classifier scripts tests

      - name: Check formatting with black
        run: uv run black --check intent_classifier scripts

      - name: Run tests (full suite, excluding real external APIs)
        env:
          # Avoid accidental real API calls in CI
          TEST_REAL_APIS: "0"
        run: |
          uv run pytest -q

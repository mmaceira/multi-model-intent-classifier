[project]
name = "multi-model-intent-classifier"
version = "0.1.0"
description = "A production-ready NLP pipeline for automated intent classification and semantic search, built on the CLINC150 dataset."
authors = [{ name = "Marc Maceira" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backoff~=2.2.1",
    "cloudpickle~=3.0.0",
    "cryptography>=41.0.0",
    "datasets>=2.0.0",
    "email-validator>=2.0.0",
    "faiss-cpu==1.11.0",                 # Pin for ABI compatibility
    "litellm[proxy]>=1.0.0",
    "nest-asyncio~=1.6.0",
    "numpy==2.2.5",                      # Pin for compatibility
    "openai~=1.77.0",
    "pandas~=2.2.3",
    "pydantic~=2.11.4",
    "python-dotenv~=1.1.0",
    "pyyaml",
    "scikit-learn==1.6.1",               # Pin for compatibility
    "sentence-transformers~=4.1.0",
    "tqdm~=4.67.1",
    "matplotlib~=3.10.1",
    "seaborn~=0.13.2",
    "dataframe_image~=0.2.7",
]

[project.scripts]
intent-train = "scripts.pipeline.run_all:main"
intent-classify = "scripts.classify_cli:main"
rag-cli = "scripts.rag_cli:main"
api-serve = "scripts.api.main_api:cli"

[project.optional-dependencies]

api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
]
ui = [
    "gradio>=5.0,<6",
]
dev = [
    "pre-commit>=3.7,<4",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "black>=24.0,<25",
]
# Install all optional dependencies (combines all extras)
all = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "gradio>=5.0,<6",
    "pre-commit>=3.7,<4",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "black>=24.0,<25",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["rag_llm"]

[tool.setuptools.packages.find]
where = ["."]
include = ["intent_classifier*"]
exclude = ["setup*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["intent_classifier"]
combine-as-imports = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

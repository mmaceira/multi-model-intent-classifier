[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"

[tool.commitizen.customize]
# Optional: enforce branch naming on commit/push via pre-commit hook above
message_template = "{{commit.type}}: {{commit.subject}}\n\n{{commit.body}}\n\n{{commit.footer}}"
